name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Atualiza a cópia local (fallback) da planilha diariamente, 06:17 em Recife.
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Atualizar cópia local da aba AGENDA
        # Se a planilha estiver inacessível, mantém o snapshot versionado.
        run: python3 scripts/gerar_snapshot.py || echo "::warning::Snapshot não atualizado; usando o versionado."
      - name: Montar site
        run: |
          mkdir _site
          cp -r index.html .nojekyll css js assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
